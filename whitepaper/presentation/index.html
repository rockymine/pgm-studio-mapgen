  <h1>Marlbeck &amp;<br>the four documents</h1>
  <p class="lead">A PGM map is a million blocks and a contract, and nothing connects them.
     This is what changes when it is four documents and a compiler instead.</p>
  <p style="max-width:46ch;margin-top:1.4em;font-size:clamp(13px,1.3vw,17px)">Every figure was produced by
     the running studio while these slides were written. The board in them was built from nothing, in five
     revisions, and every refusal it met is here.</p>
</section>

<!--S-->
<section class="slide">
  <p class="eyebrow">01 &middot; the problem</p>
  <h2>Two artifacts, and nothing joins them</h2>
  <div class="cols two body">
    <div>
      <pre>&lt;map&gt;/region/*.mca   <span class="d">the world — every block</span>
&lt;map&gt;/level.dat
&lt;map&gt;/map.xml        <span class="d">what the server loads</span></pre>
      <p style="margin-top:1.2em">The world is built by hand in creative, over days. The
        <code>map.xml</code> is written in a text editor. The two are joined only by coordinates a person
        typed into both.</p>
    </div>
    <ul class="marks">
      <li><span>01</span><span><b>The XML has no feedback until it fails.</b> A region is a box of numbers.
        Whether it holds ground, whether that ground is reachable, whether the barred team is the one meant
        to be barred — none of it is in the file, and the file is all that gets read.</span></li>
      <li><span>02</span><span><b>The world cannot be interrogated.</b> "Is this approach walkable" is
        answered by walking it. "Is any of this ground used" is not answered at all — so it stops being
        asked.</span></li>
      <li><span>03</span><span><b>Nothing is reusable, because nothing is described.</b> A hill that works
        is a hill. Every board starts at bedrock.</span></li>
    </ul>
  </div>
</section>

<!--S-->
<section class="slide">
  <p class="eyebrow">01 &middot; the problem &middot; <b>what that costs, measured</b></p>
  <h2>Two of the earliest boards<br>are 245 bytes of contract</h2>
  <div class="cols narrow-left body">
    <pre class="refuse">$ wc -c maps/haiku-r2-canonical-8/map.xml
<b>245</b>

$ grep -c '&lt;wool' maps/haiku-r2-canonical-8/map.xml
<b>0</b>

<span class="d">a name, an empty version, a gamemode,
an empty objective, one include —
over real region files</span></pre>
    <div>
      <p>The run that made them reported both as <em>"Compiled, sketched, finished, exported
        successfully."</em> It was not lying: the only check that existed was whether the pipeline threw.</p>
      <p>They are still in the repository, and the README says why:</p>
      <blockquote>They are kept because they are evidence, not because they are playable — a map with nothing
        on it satisfies every refusal the pipeline had at the time. <b>Do not load them.</b>
        <cite>pgm-studio-mapgen/README.md</cite></blockquote>
    </div>
  </div>
</section>

<!--S-->
<section class="slide">
  <p class="eyebrow">02 &middot; the idea</p>
  <h2>A map is four documents</h2>
  <div class="body">
    <div class="tw">
      <table>
        <tr><th>Level</th><th>Describes</th><th>Document</th><th>Tool</th></tr>
        <tr class="hi"><td><b>The board</b></td><td>rectangles on a coarse cell grid, what each is for,
          where the objectives sit</td><td><code>PlanModel</code></td><td>Plan</td></tr>
        <tr class="hi"><td><b>The ground</b></td><td>the real geometry at block resolution — outlines,
          heights, relief, paint, props</td><td><code>SketchLayout</code></td><td>Sketch</td></tr>
        <tr class="hi"><td><b>The play</b></td><td>teams, spawns, protections, build regions, objectives and
          how they are captured</td><td><code>MapIntent</code></td><td>Configure</td></tr>
        <tr class="hi"><td><b>The map</b></td><td>the voxel world and the <code>map.xml</code> a server
          loads</td><td><code>VoxelWorld</code> + <code>MapXml</code></td><td>— (built)</td></tr>
      </table>
    </div>
    <p style="margin-top:.6em"><strong>These are grains, not stages of completeness.</strong> A plan is not a
      rough draft of a layout: it states things a layout cannot — <em>this rectangle is a wool room</em>,
      <em>these two pieces share a defence wall</em> — and cannot state a curve or a one-block step. A layout
      knows where every block of ground is and has no idea what any of it is for.</p>
    <p><strong>Which is why each question can be asked where it has an answer.</strong> <em>Is the objective
      too close to its own spawn?</em> is a question about the board, and it is answerable before a single
      block exists.</p>
  </div>
</section>

<!--S-->
<section class="slide">
  <p class="eyebrow">02 &middot; the idea &middot; <b>the flow is one-way</b></p>
  <h2>Five hand-offs,<br>and nothing reads back up</h2>
  <div class="cols narrow-left body">
    <pre>                ┌──► layout ──finish──► world ───┐
plan ──compile──┤                                │──► what a
                └──► intent ──project─► document ┘    server loads</pre>
    <div>
      <p>The two branches rejoin at the end rather than staying independent: building the world
        <strong>resolves</strong> part of the intent — a monument's block volume can only be fixed by the
        terrain it floats over — so the <code>map.xml</code> is rendered from a resolved copy.</p>
      <p>There is <strong>no route back</strong>. No endpoint in the studio reads a <code>map.xml</code> at
        all. A map reaches another studio only as a world, arriving without its plan, its drawing or its
        intent, and can never be re-planned.</p>
      <p>A browser walks the five one at a time. A program does not:
        <code>POST /map/from-documents</code> takes all three together and stores the whole map in one call,
        under a slug it states — so a corrected spec re-driven <em>replaces</em> its map instead of leaving
        <code>board-2</code> and <code>board-3</code> behind.</p>
    </div>
  </div>
</section>

      <p>Each names <strong>the number it measured and the band it missed</strong>. <code>GO1</code> is the
        destroy board's central proportion: a monument sits three to four times as far from the enemy's spawn
        as from its own, by walk. 4.523 says it was too close to the team defending it.</p>
      <p>The arithmetic is solvable on paper. With spawns <code>L</code> apart and the goal <code>d</code>
        from its own, the ratio is about <code>(L − d) / d</code> — so the band puts the goal between
        <code>L/5</code> and <code>L/4</code>.</p>
      <pre class="ok" style="margin-top:1.2em">score <b>0</b>   valid <b>True</b>
violations <b>0</b>   lint <b>0</b></pre>
      <p style="margin-top:.9em">Ten blocks toward the middle answers <code>GO1</code> and <code>GO3</code>
        together. Everything decided so far is the <em>arrangement</em>, and none of it has cost a build.</p>
    </div>

        degrees.</strong> The fell's face, the beck's banks and the shelf's rim are all drawn by these eleven
        lines, and none is stated anywhere as a place.</p>
      <p>A theme hung on plan pieces, or on height bands, paints a board flat from above however much relief
        is under it — nothing in the geometry tells a 45° hillside from a meadow. It is the most common way a
        board in this corpus has come out looking wrong. <code>GET …/incline?format=text</code> is the read
        that says where the bands should cut.</p>

<section class="slide">
  <p class="eyebrow">05 &middot; the mechanism</p>
  <h2>One envelope, everywhere</h2>
  <div class="cols two body">
    <div>
      <pre>{ "error":   "invalid house style",
  "message": "doorHead.block (5) is not a stair…",
  "findings": [

      "message":  "…",
      "severity": <b>"refusal"</b>,
      "field":    <b>"doorHead.block"</b> } ] }</pre>
      <p style="margin-top:1.1em"><code>error</code> names the <strong>gate</strong>, never the fault.
        <code>findings</code> is what to act on — each with a rule id, a sentence with the measured numbers in
        it, and where the fault is.</p>
      <p><strong>400</strong> wrong as posted · <strong>404</strong> no such subject ·
         <strong>409</strong> conflicts with stored state · <strong>422</strong> cannot be processed ·
         <strong>500</strong> the studio's own fault. <b>156 of 219 operations</b> declare theirs rather than
         having it guessed from the path.</p>
    </div>
    <div>
      <h3>Three severities — and a 200 is half an answer</h3>
      <div class="tw"><table>
        <tr><td><span class="chip r">refusal</span></td><td>the work stopped; nothing was written</td></tr>
        <tr><td><span class="chip w">decline</span></td><td>the work happened and one piece of what you wrote
          is <b>not in it</b></td></tr>
        <tr><td><span class="chip g">complaint</span></td><td>the work happened and lost nothing; something is
          worth saying anyway</td></tr>
      </table></div>
      <p style="margin-top:1.1em">Every 2xx JSON object answers a <code>warnings</code> array, and every
        operation declares a <code>Pgm-Warnings</code> header — <code>6 RQ3 SK3 SK4</code> — so the count and
        the rule ids are readable before the body is parsed.</p>
      <p>There is a second header for the opposite case. <code>Pgm-Unwalked</code> names the rules a read
        <strong>did not ask</strong>. <em>These were found</em> and <em>these were not asked</em> are
        different claims and get different headers.</p>
    </div>
  </div>

<section class="slide">
  <p class="eyebrow">06 &middot; agentic map making &middot; <b>the failure mode</b></p>
  <h2>A correct measurement<br>plus an invented conclusion</h2>
  <div class="cols two body">
    <div>
      <p>Not a hallucination, and not a wrong number. <strong>A real reading, generalised one step too far,
        and then written down as though it had been checked.</strong></p>
      <blockquote>I rebuilt a board at twice its size because an evaluator printed the word "hard"… I took
        that for <em>this will not build</em>. <b>Nothing refuses on <code>G2</code> or <code>G5</code>.</b>
        They are scoring terms. I never ran that test; I inferred the answer from a word.</blockquote>
      <p style="margin-top:1.2em">The cascade is the instructive part: doubling the cell doubled the two
        rectangles whose size is a fact in blocks, which tripped a cap, which forced a split, which needed
        four shelf pieces nobody drew — <strong>4,944 blocks of dead-level pad, 21% of the board's
        ground</strong>. Each step was locally reasonable and the chain was never re-read against the
        original.</p>
    </div>
    <div>
      <h3>The mitigations that work are all mechanical</h3>
      <ul class="marks">
        <li><span>id</span><span>a finding names a <b>rule id</b>, so <em>what does this mean</em> has a route
          (<code>GET /api/rules?rule=…</code>) instead of an inference</span></li>
        <li><span>path</span><span>a finding names a <b>JSON path</b>, so a wrong field is a fact rather than a
          hunt</span></li>
        <li><span>200</span><span>a success carries <b><code>warnings</code></b>, so <em>it worked</em> is not
          a status code</span></li>
        <li><span>×3</span><span>three verdicts are required before <em>"missing from the system"</em> may be
          written: <b>missing</b> (no mechanism), <b>unreachable</b> (it exists, the surface hid it),
          <b>mistaken</b> (it exists, documented, not found) — <em>"a verdict is not the model's to award on
          its own claim"</em></span></li>
      </ul>
      <p style="margin-top:1.4em"><em>"Of the nine things in this report I could not say, <strong>five were the
        schema being right and me reading it wrong</strong>, three were a deliberate rule saying no and saying
        why, and one was the surface genuinely unable to answer. That ratio is the useful number."</em></p>
    </div>
  </div>
</section>

<!--S-->
<section class="slide">
  <p class="eyebrow">07 &middot; collaboration</p>
  <h2>The seam is not where<br>most people put it</h2>
  <div class="cols narrow-left body">
    <div>
      <blockquote style="font-size:clamp(17px,2.1vw,28px)">The measurements and the code reading are the
        model's. <b>Every correction that mattered about the map was the author's.</b>
        <cite>the earliest report in the corpus, and unchanged since</cite></blockquote>
    </div>
    <div>
      <h3>The oracle rule</h3>
      <p>A rule about the map <strong>as it is played</strong> is not derivable from the repository. The corpus
        shows what authors did; the code shows what the tool does; <strong>neither says what is
        correct.</strong></p>
      <p>So the discipline is: make the judgement, <em>build it</em>, and record the question in the report as
        an open question rather than filing it as a fact.</p>
      <h3 style="margin-top:1.6em">The failure this prevents has already happened</h3>
      <p>A destroyable and a core <strong>float a few blocks above the terrain by design</strong> — a core on
        the ground cannot leak, and a destroyable on the ground is trivially covered. That has been the
        server's behaviour from the start.</p>
      <p>Measuring the gap and reasoning from first principles produced a confident, filed, committed claim
        that <strong>every generated destroy map was unwinnable</strong>.</p>
      <p><strong>The measurement was right and the conclusion was invented.</strong> Neither the corpus nor
        the code would have corrected it. One question would have.</p>
    </div>
  </div>
</section>

<section class="slide">
  <p class="eyebrow">09 &middot; what it adds up to</p>
  <h2>Three claims</h2>
  <div class="body" style="justify-content:center;gap:clamp(20px,3.4vh,40px)">
    <div>
      <h3>01 &middot; Describing a map as documents makes it checkable</h3>
      <p>A plan is two pieces and two markers, and answers <code>GO1</code> in two seconds; a world is a
        million blocks and answers nothing. The four-level split is not tidiness — it is what puts each question at the grain
        where it has an answer.</p>
    </div>
    <div>
      <h3>02 &middot; A system that refuses by name can be driven without a human watching each step</h3>
      <p>111 worlds say so. The mechanisms are small and specific: a rule id per finding, a JSON path per
        field, <code>warnings</code> on a 200, a text twin for every picture. Remove any one and the corpus
        records what happens.</p>
    </div>
    <div>
      <h3>03 &middot; The seam between the person and the model is real, and it moves</h3>
      <p>The person owns what the map is for; the model owns what it measures. What has not moved, and shows
        no sign of moving, is the first row: <strong>whether a board is worth playing is asked, not
        derived.</strong> The one time this repository forgot that, it committed an entirely invented
        conclusion from a measurement that was correct. The rule that prevents it costs one question.</p>
    </div>
  </div>
</section>

<script>
(() => {
  const src = document.getElementById('slides').textContent;
  document.getElementById('deck').innerHTML = src;
  const slides = [...document.querySelectorAll('.slide')];
  const total = slides.length;
  document.getElementById('tot').textContent = total;
  const cur = document.getElementById('cur');
  const hint = document.getElementById('hint');
  const bands = [document.getElementById('rail-a'), document.getElementById('rail-b'),
                 document.getElementById('rail-c')];
  let i = 0;

  // The rail is the three slope bands a terrain theme paints with, filled in proportion to progress.
  function paintRail(frac) {
    const w = frac * 100, cuts = [0.42, 0.30, 0.28];
    let left = w;
    bands.forEach((el, n) => {
      const share = Math.max(0, Math.min(cuts[n] * 100, left));
      el.style.width = share + '%';
      left -= share;
    });
  }

  function show(n) {
    i = Math.max(0, Math.min(total - 1, n));
    slides.forEach((s, k) => s.classList.toggle('on', k === i));
    cur.textContent = i + 1;
    paintRail((i + 1) / total);
    if (i > 0) hint.classList.add('gone');
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { show(i + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(i - 1); e.preventDefault(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(total - 1);
  });
  addEventListener('click', e => {
    if (e.target.closest('a, pre, .tw')) return;      // let a link, a code block and a table be used
    show(e.clientX > innerWidth * 0.5 ? i + 1 : i - 1);
  });
  let x0 = null;
  addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 44) show(i + (dx < 0 ? 1 : -1));
    x0 = null;
  }, { passive: true });

  addEventListener('hashchange', () => {
    const n = (parseInt(location.hash.slice(1), 10) || 1) - 1;
    if (n !== i) show(n);
  });

  show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
})();
</script>
